<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 88">
  <defs>
    <path id="shape" d="M33 5C50 5 61 22 61 44C61 66 49 81 33 81C16 81 5 66 5 42C5 20 16 5 33 5Z"/>
    <clipPath id="inside"><use href="#shape"/></clipPath>
    <pattern id="halftone" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.1" fill="#3A2318"/>
    </pattern>
  </defs>

  <!-- off-register print shadow -->
  <use href="#shape" transform="translate(4 4)" fill="#A63A2A"/>

  <!-- flat roast color, darker side with halftone dots -->
  <use href="#shape" fill="#9C5A32"/>
  <g clip-path="url(#inside)">
    <ellipse cx="52" cy="48" rx="22" ry="40" fill="#6E3B22"/>
    <ellipse cx="52" cy="48" rx="22" ry="40" fill="url(#halftone)" opacity="0.6"/>
  </g>

  <!-- crease with a cream edge -->
  <path d="M31 10C21 25 40 36 30 50C21 62 35 71 29 78" fill="none" stroke="#F3E6CF" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  <path d="M34 10C24 25 43 36 33 50C24 62 38 71 32 78" fill="none" stroke="#3A2318" stroke-width="4.5" stroke-linecap="round"/>

  <!-- hand-drawn shine -->
  <path d="M15 30C15 22 19 15 25 11" fill="none" stroke="#F3E6CF" stroke-width="3" stroke-linecap="round"/>
  <path d="M14 37v3" fill="none" stroke="#F3E6CF" stroke-width="3" stroke-linecap="round"/>

  <!-- ink outline -->
  <use href="#shape" fill="none" stroke="#3A2318" stroke-width="3"/>
</svg>
