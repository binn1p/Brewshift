<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title.staff">My shifts — minh</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Be+Vietnam+Pro:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n.js" defer></script>
  <script src="js/i18n-admin.js" defer></script>
  <script src="js/i18n-vi.js" defer></script>
  <script src="js/options.js" defer></script>
  <script src="js/menu-data.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/decor.js" defer></script>
  <script src="js/staff.js" defer></script>
</head>
<body data-decor="beans" data-langs="en fr vi">

  <div class="card">
    <div class="decor" aria-hidden="true"></div>

    <header class="site-header">
      <a class="back-link" href="hub.html" data-i18n="nav.back">&larr; Back</a>
      <img class="logo" src="images/minh-4-saloon-light.svg" alt="minh">
      <button type="button" class="login-link done-button" id="done" data-i18n="nav.done">Done</button>
    </header>

    <main class="staff">
      <section class="panel staff__me">
        <p class="staff__hello" data-i18n="staff.hi">Hi,</p>
        <h1 class="staff__name" id="staff-name"></h1>
        <p class="staff__status" id="staff-status"></p>
        <p class="staff__today" id="staff-today"></p>
        <button type="button" class="punch-button" id="punch"></button>
        <p class="staff__toast" id="staff-toast" role="status"></p>
      </section>

      <section class="panel staff__week" aria-labelledby="week-title">
        <div class="staff__week-head">
          <button type="button" class="week-nav" id="week-prev" aria-label="Previous week" data-i18n-attr="aria-label:staff.prevWeek">&larr;</button>
          <h2 id="week-title"></h2>
          <button type="button" class="week-nav" id="week-next" aria-label="Next week" data-i18n-attr="aria-label:staff.nextWeek">&rarr;</button>
          <p class="staff__week-total" id="week-total"></p>
        </div>
        <ol class="week" id="week"></ol>
      </section>

      <section class="panel staff__next">
        <h2 data-i18n="staff.nextShifts">Next shifts</h2>
        <ul class="next-shifts" id="next-shifts"></ul>
      </section>

      <section class="panel staff__export">
        <h2 data-i18n="staff.workHours">Work hours</h2>
        <button type="button" class="button button--small" id="download" data-i18n="staff.download">Download CSV</button>
        <button type="button" class="button button--small button--light" id="print" data-i18n="staff.print">Print</button>
      </section>
    </main>

  </div>

  <!-- Only shown when printing: this week's hour log -->
  <section class="print-log" aria-hidden="true">
    <h1 id="print-title"></h1>
    <table>
      <thead><tr><th data-i18n="staff.col.date">Date</th><th data-i18n="staff.col.in">Clock in</th><th data-i18n="staff.col.out">Clock out</th><th data-i18n="staff.col.hours">Hours</th></tr></thead>
      <tbody id="print-rows"></tbody>
    </table>
    <p id="print-total"></p>
  </section>

</body>
</html>
