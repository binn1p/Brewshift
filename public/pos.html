<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title.pos">Counter — minh</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Be+Vietnam+Pro:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n.js" defer></script>
  <script src="js/i18n-admin.js" defer></script>
  <script src="js/i18n-vi.js" defer></script>
  <script src="js/options.js" defer></script>
  <script src="js/menu-data.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/decor.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/drink-window.js" defer></script>
  <script src="js/order-tools.js" defer></script>
  <script src="js/menu.js" defer></script>
  <script src="js/pos.js" defer></script>
</head>
<body data-decor="beans" data-langs="en fr vi" data-cart="pos">

  <div class="card">
    <div class="decor" aria-hidden="true"></div>

    <header class="site-header">
      <a class="back-link" href="hub.html" data-i18n="nav.back">&larr; Back</a>
      <img class="logo" src="images/minh-4-saloon-light.svg" alt="minh">
      <button type="button" class="login-link done-button" id="today" data-i18n="pos.today">Today's orders</button>
    </header>

    <p class="pos__who" id="pos-who"></p>

    <!-- Same menu canvas as the customer page; the bag is the counter ticket -->
    <main class="menu-canvas" id="menu-canvas">
      <h1 class="visually-hidden" data-i18n="hub.pos">Take an order</h1>
    </main>
    <section class="menu-more" id="menu-more" aria-label="More drinks" hidden></section>

  </div>

  <dialog class="window today" id="today-window"></dialog>

</body>
</html>
