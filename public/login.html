<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title.login">Log in — minh</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Be+Vietnam+Pro:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n.js" defer></script>
  <script src="js/options.js" defer></script>
  <script src="js/menu-data.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/decor.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/drink-window.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body data-decor="beans">

  <div class="card">
    <div class="decor" aria-hidden="true"></div>

    <header class="site-header">
      <a class="back-link" href="index.html" data-i18n="nav.home">&larr; Home</a>
      <a class="logo-link" href="index.html"><img class="logo" src="images/minh-4-saloon-light.svg" alt="minh, back to home" data-i18n-attr="alt:nav.logoHome"></a>
      <a class="login-link" href="login.html" data-i18n="nav.login">Log In</a>
    </header>

    <main class="admin account">
      <h1 class="admin__title" data-i18n="login.title">Members</h1>
      <p class="admin__hint" data-i18n="login.intro">Earn points on every drink. Spend them at the café.</p>
      <div class="login__grid">
        <form class="panel login__box" id="login-form">
          <h2 data-i18n="login.signIn">Log in</h2>
          <label class="field"><span data-i18n="login.email">Email</span><input name="email" type="email" required autocomplete="email"></label>
          <label class="field"><span data-i18n="login.password">Password</span><input name="password" type="password" required autocomplete="current-password"></label>
          <p class="admin__error" role="alert"></p>
          <button type="submit" class="button" data-i18n="login.signIn">Log in</button>
          <p class="admin__hint" data-i18n="login.demo">Demo: alex@example.com / coffee123</p>
        </form>
        <form class="panel login__box" id="register-form">
          <h2 data-i18n="login.register">Create an account</h2>
          <label class="field"><span data-i18n="login.name">Name</span><input name="name" required maxlength="60" autocomplete="name"></label>
          <label class="field"><span data-i18n="login.email">Email</span><input name="email" type="email" required autocomplete="email"></label>
          <label class="field"><span data-i18n="login.phone">Phone</span><input name="phone" type="tel" required autocomplete="tel" placeholder="(514) 555-0142"></label>
          <label class="field"><span data-i18n="login.password">Password</span><input name="password" type="password" required minlength="6" autocomplete="new-password"></label>
          <label class="field--check"><input type="checkbox" name="promos" checked> <span data-i18n="login.promos">Send me promotions by email and text</span></label>
          <p class="admin__error" role="alert"></p>
          <button type="submit" class="button" data-i18n="login.create">Create my account</button>
        </form>
      </div>
    </main>

  </div>

</body>
</html>
