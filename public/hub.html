<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title.hub">Start — minh</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Be+Vietnam+Pro:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n.js" defer></script>
  <script src="js/i18n-admin.js" defer></script>
  <script src="js/i18n-vi.js" defer></script>
  <script src="js/options.js" defer></script>
  <script src="js/menu-data.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/decor.js" defer></script>
  <script src="js/hub.js" defer></script>
</head>
<body data-decor="beans" data-langs="en fr vi">

  <div class="card">
    <div class="decor" aria-hidden="true"></div>

    <header class="site-header">
      <span></span>
      <img class="logo" src="images/minh-4-saloon-light.svg" alt="minh">
      <button type="button" class="login-link done-button" id="done" data-i18n="hub.switch">Switch user</button>
    </header>

    <main class="hub" id="hub">
      <h1 class="hub__hello" id="hub-hello"></h1>

      <a class="tile hub__tile hub__clock" href="staff.html">
        <h2 class="tile__title" data-i18n="hub.clock">Clock in / out</h2>
        <p id="hub-clock-status"></p>
        <span class="tile__cta" data-i18n="hub.clockCta">My shifts and hours →</span>
      </a>

      <a class="tile hub__tile hub__pos" href="pos.html">
        <h2 class="tile__title" data-i18n="hub.pos">Take an order</h2>
        <p data-i18n="hub.posText">For customers at the counter</p>
        <span class="tile__cta" data-i18n="hub.posCta">Open the menu →</span>
      </a>

      <a class="tile hub__tile hub__queue" href="queue.html">
        <h2 class="tile__title" data-i18n="hub.queue">Orders</h2>
        <p id="hub-queue-count"></p>
        <span class="tile__cta" data-i18n="hub.queueCta">Current orders →</span>
      </a>

      <a class="tile hub__tile hub__manager" href="dashboard.html" id="hub-manager" hidden>
        <h2 class="tile__title" data-i18n="hub.manager">Manager</h2>
        <p data-i18n="hub.managerText">Sales, orders, menu, shifts, employees</p>
        <span class="tile__cta" data-i18n="hub.managerCta">Open the dashboard →</span>
      </a>
    </main>

  </div>

</body>
</html>
